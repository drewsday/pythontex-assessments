name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: assessment logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests/ -v

  typeset:
    name: pdflatex build (advisory)
    runs-on: ubuntu-latest
    # Non-blocking on purpose: this job has not yet had a green run, and some
    # assessments have LaTeX defects that predate it -- PowerInDCCircuits2.tex
    # emits a one-argument \SI, which is a hard error. Flip continue-on-error to
    # false once it passes and tests/known_defects.py is empty of LaTeX entries;
    # it then becomes the check covering the Python/LaTeX seam that the pytest
    # job cannot reach.
    continue-on-error: true
    env:
      # Documents that do `from pylab import *` must not try to open a display.
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-pictures \
            texlive-fonts-recommended \
            python3-pygments

      - name: Install the Python packages the assessments import
        run: |
          python -m pip install --upgrade pip
          # pythontex is NOT on PyPI -- it ships with TeX Live and is installed
          # by the step above. Only the packages the documents themselves import
          # belong here, plus randassign, which pythontex imports at run time.
          pip install -r requirements-dev.txt
          pip install randassign

      - name: Locate pythontex
        run: |
          # Which TeX Live package provides the launcher varies between
          # distributions, so resolve it rather than assuming a path.
          if command -v pythontex >/dev/null 2>&1; then
            echo "PYTHONTEX=pythontex" >> "$GITHUB_ENV"
          elif command -v pythontex3 >/dev/null 2>&1; then
            echo "PYTHONTEX=pythontex3" >> "$GITHUB_ENV"
          else
            script="$(kpsewhich --format=texmfscripts pythontex.py || true)"
            if [ -n "$script" ] && [ -f "$script" ]; then
              echo "PYTHONTEX=python3 $script" >> "$GITHUB_ENV"
            else
              echo "could not find pythontex after installing TeX Live" >&2
              exit 1
            fi
          fi
          echo "resolved pythontex"

      - name: Typeset every assessment
        run: |
          set -o pipefail
          # pythontex needs the full three-pass cycle: pdflatex to emit the code,
          # pythontex to run it, pdflatex again to pull the output back in.
          # `--interpreter python:python3` matters because Ubuntu ships no bare
          # `python`, which is pythontex's default.
          failed=""
          # Only standalone documents. attempt.tex and name.tex are \input
          # fragments and are not compilable on their own.
          docs="$(grep -l --include='*.tex' -r '\\documentclass' . | sort)"
          echo "documents to build:"
          echo "$docs" | sed 's/^/  /'
          for tex in $docs; do
            dir="$(dirname "$tex")"
            file="$(basename "$tex")"
            base="${file%.tex}"
            echo "::group::$tex"
            if ( cd "$dir" \
                 && pdflatex -interaction=nonstopmode -file-line-error "$file" >/dev/null 2>&1 \
                 && $PYTHONTEX --interpreter python:python3 "$file" \
                 && pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$file" >/dev/null 2>&1 ); then
              echo "ok: $tex"
            else
              echo "FAILED: $tex"
              # Surface the actual LaTeX error lines rather than the whole log.
              grep -E '^(.*:[0-9]+:|!)' "$dir/$base.log" 2>/dev/null | head -20 || true
              failed="$failed $tex"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "documents that did not typeset:$failed"
            exit 1
          fi
          echo "all documents typeset cleanly"
