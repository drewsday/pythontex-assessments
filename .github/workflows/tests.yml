name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: assessment logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests/ -v

  typeset:
    name: pdflatex build (advisory)
    runs-on: ubuntu-latest
    # Non-blocking on purpose. Some assessments have LaTeX defects that predate
    # this workflow -- PowerInDCCircuits2.tex emits a one-argument \SI, which is
    # a hard error -- so this job reports rather than gates. Flip
    # continue-on-error to false once tests/known_defects.py is empty of LaTeX
    # entries, and it becomes the check that covers the Python/LaTeX seam the
    # pytest job cannot reach.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TeX and pythontex
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-pictures \
            texlive-fonts-recommended \
            python3-pygments
          python -m pip install --upgrade pip
          pip install pythontex randassign

      - name: Typeset every assessment
        run: |
          # pythontex needs the full three-pass cycle: pdflatex to emit the code,
          # pythontex to run it, pdflatex again to pull the output back in.
          failed=""
          for tex in *.tex; do
            echo "::group::$tex"
            base="${tex%.tex}"
            if pdflatex -interaction=nonstopmode -halt-on-error "$tex" >/dev/null 2>&1 \
               && pythontex "$tex" >/dev/null 2>&1 \
               && pdflatex -interaction=nonstopmode -halt-on-error "$tex" >/dev/null 2>&1; then
              echo "ok: $tex"
            else
              echo "FAILED: $tex"
              tail -40 "$base.log" 2>/dev/null || true
              failed="$failed $tex"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "documents that did not typeset:$failed"
            exit 1
          fi
